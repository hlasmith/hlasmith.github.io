# Goes in your repo at: .github/workflows/auto-merge.yml
#
# Turns on GitHub's native auto-merge for PRs from the scheduled task, but ONLY
# when they are not drafts. The routine opens hygiene-lane changes as normal PRs
# (auto-merge) and review-lane changes as DRAFT PRs (this skips them, so they
# wait for you). Auto-merge then only completes once the quality checks pass and
# branch protection is satisfied.

name: Enable auto-merge for claude PRs

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: startsWith(github.head_ref, 'claude/') && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Enable squash auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
