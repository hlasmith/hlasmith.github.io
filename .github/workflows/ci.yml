# Goes in your repo at: .github/workflows/ci.yml
#
# Runs on every PR into main. Currently in "report, don't block" mode so the
# routine can clean up pre-existing issues. Once the site is polished, switch
# lychee's `fail` to true and the .lighthouserc.json assertions back to "error"
# to make this a strict gate again.

name: PR quality checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check for broken links (report only)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200..=299,403,429,503,999 "**/*.html"
          fail: false

      - name: Lighthouse CI (performance, a11y, SEO, best practices)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: false
          temporaryPublicStorage: false
